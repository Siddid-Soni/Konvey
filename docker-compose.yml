services:
  postgres:
    image: postgres:16-alpine
    container_name: konvey-postgres
    environment:
      POSTGRES_DB: konvey
      POSTGRES_USER: konvey
      POSTGRES_PASSWORD: konvey
    ports:
      - "127.0.0.1:5432:5432"   # local only: the credentials are well known
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./web/schema.sql:/docker-entrypoint-initdb.d/10-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U konvey -d konvey"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
