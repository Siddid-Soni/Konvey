# Trial env for Higgs TTS 3 through the transformers port (multimodalart/higgs-audio-v3-tts-4b-transformers),
# loaded 8-bit with bitsandbytes to fit the 8 GB card. Kept apart from Konvey's .venv.
[project]
name = "tts-trial-higgs"
version = "0"
requires-python = ">=3.11,<3.13"
dependencies = [
    "torch==2.9.1",
    "torchaudio==2.9.1",
    "transformers>=5.5",
    "accelerate>=1.12",
    "bitsandbytes>=0.48",
    "soundfile>=0.13",
    "librosa>=0.11",
]
