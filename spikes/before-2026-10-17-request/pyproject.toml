[project]
name = "konvey"
version = "0.1.0"
description = "Konvey — 3-agent explainer-video pipeline (Knowledge Discovery -> Planning + Scene Generation -> Manim Coding) implemented with Agno"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "agno>=3.0.10",
    "anthropic>=1.14.0",
    "google-genai>=2.30.1",
    "openai>=3.15.0",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.3",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
layout = [
    "playwright>=1.64.0",
]
render = [
    "manimgl>=1.7.2",
    "setuptools<81",
]
# Narration (konvey.speech): Chatterbox Turbo TTS, run on the GPU before manimgl renders.
speech = [
    "chatterbox-tts==0.1.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["konvey"]

[tool.pytest.ini_options]
testpaths = ["tests"]
