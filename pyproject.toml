[project]
name = "konvey"
version = "0.1.0"
description = "Konvey — 3-agent explainer-video pipeline (Knowledge Discovery -> Planning + Scene Generation -> Manim Coding) implemented with Agno"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "agno>=3.0.10",
    "openai>=3.15.0",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.3",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["konvey"]

[tool.pytest.ini_options]
testpaths = ["tests"]
